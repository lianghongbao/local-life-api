# ============================================================
# local-life-api 部署
# ============================================================
# MySQL / Redis 走共享底座（deploy/infra/），本文件只跑业务容器。
#
# 共享底座先起：
#   cd deploy/infra && ./deploy.sh up
#
# 所有凭证从 deploy/.env 读取(需 .gitignore)
# 首次使用:cp deploy/.env.example deploy/.env 并填真实值

name: local-life

services:
  # ============================================================
  # 主服务
  # ============================================================
  local-life-api:
    # image 由 CI 从镜像仓库 pull 后 re-tag 成 ${IMAGE_NAME}:server-latest
    # 本地 docker compose up 时 fallback 到 ${IMAGE_NAME:-local-life-api},需自带标签
    image: ${IMAGE_NAME:-local-life-api}:server-latest
    build:
      # 构建上下文是仓库根（local-life-api/），跟 CI 的 `docker buildx build -f Dockerfile .` 一致。
      # Dockerfile 里的 COPY entrypoint.sh / COPY etc/mini-api.yaml 都是相对仓库根的路径。
      context: ../
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER:-local-life-api}
    restart: unless-stopped
    stop_grace_period: 30s    # 优雅停机:30s 内处理完 in-flight 请求再退出
    env_file: .env
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
      # 共享底座的 mysql —— 容器名只在 shared-infra-net 网络里可解析
      - DB_DATASOURCE=root:${MYSQL_ROOT_PASSWORD}@tcp(shared-mysql:3306)/local_life?charset=utf8mb4&parseTime=True&loc=Local
      # 共享底座的 redis —— 跟 chatroom 共用实例,靠 key 前缀隔离
      - REDIS_HOST=shared-redis:6379
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY}
    volumes:
      # named volume:容器内 app 用户(uid 1000)有写权限,无需 bind mount
      - api-logs:/data/logs/mini-api
    networks:
      # 共享底座的网络。external —— 网络由 deploy/infra 创建,不由本 compose 管
      - shared-infra-net
    # 没有 depends_on:mysql / redis 是别的 compose project 的 service,
    # 跨 project 的 depends_on 不生效。共享底座由 deploy/infra 负责保活。

networks:
  shared-infra-net:
    external: true
    name: shared-infra-net

volumes:
  api-logs:
