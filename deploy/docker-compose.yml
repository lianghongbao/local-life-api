# ============================================================
# local-life-api 部署
# ============================================================
# 业务容器。MySQL / Redis 是独立部署的服务，通过 data-net 网络访问。
#
#   起：  cp .env.example .env && 填好凭证
#         docker compose up -d
#   停：  docker compose stop
#   看：  docker compose ps
#
# 所有凭证从 deploy/.env 读取(需 .gitignore)
# 首次使用:cp deploy/.env.example deploy/.env 并填真实值

name: local-life

services:
  local-life-api:
    # 业务镜像名。前缀由 ACR_REGISTRY_HOST/ACR_NAMESPACE 拼出，两项都设了才加前缀
    # （本地构建没配 ACR 时用裸名）。
    image: ${ACR_NAMESPACE:+${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}/}${IMAGE_NAME:-local-life-api}:server-latest
    build:
      # 构建上下文是仓库根（local-life-api/），跟 CI 的 `docker buildx build -f Dockerfile .` 一致。
      # Dockerfile 里的 COPY entrypoint.sh / COPY etc/mini-api.yaml 都是相对仓库根的路径。
      context: ../
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER:-local-life-api}
    restart: unless-stopped
    stop_grace_period: 30s    # 优雅停机:30s 内处理完 in-flight 请求再退出
    env_file: .env
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
      # MySQL —— 容器名在 data-net 网络里可解析
      - DB_DATASOURCE=root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/local_life?charset=utf8mb4&parseTime=True&loc=Local
      # Redis
      - REDIS_HOST=redis:6379
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY}
    volumes:
      # named volume:容器内 app 用户(uid 1000)有写权限,无需 bind mount
      - api-logs:/data/logs/mini-api
    networks:
      - default
      # 数据存储的网络。external —— 网络由 deploy/mysql 或 deploy/redis 创建,
      # 业务容器接进来就能用容器名访问 MySQL / Redis。
      - data-net

networks:
  data-net:
    external: true
    name: data-net

volumes:
  api-logs:
