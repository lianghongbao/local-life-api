# ============================================================
# 共享基础设施：MySQL + Redis
# ============================================================
# 所有应用（local-life-api / chatroom）共用这一套底座，
# 各自跑自己的 compose 只跑业务容器，通过 shared-infra-net 连过来。
#
# 隔离方式：
#   MySQL  同一实例，各自独立 schema（local_life / chatroom）
#   Redis  同一实例，靠 key 前缀隔离（local-life: / chatroom:）
#
# 为什么不用 Redis DB 号隔离：local-life-api 用 go-zero，
# 其 Redis 客户端把 DB 写死成 0 且配置层没有 DB 字段，
# 改 DB 得绕开 MustNewRedis 直连 go-redis。两边统一走 key 前缀更简单。
#
# compose 项目名固定为 shared-infra —— local-life-api 和 chatroom
# 两个仓库各存一份内容相同的本文件，靠这个项目名保证它们起的是
# 同一套容器，不会互相冲突。
#
#   起：  cp .env.example .env && 填好密码
#         docker compose up -d
#   停：  docker compose stop
#   看：  docker compose ps
#
# 注意：mysql 的 initdb.d 只在数据目录为空（首次创建）时执行。
# 底座已经跑过之后，改 init/ 下的 SQL 不会自动重跑，
# 需要手动 docker exec 执行（见 README.md）。

name: shared-infra

services:
  # ============================================================
  # MySQL —— 共享实例，多 schema
  # ============================================================
  mysql:
    image: ${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}:mysql-8.0
    container_name: shared-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"    # 只允许本机访问
    volumes:
      - mysql-data:/var/lib/mysql
      # 建库建表脚本 —— 只在首次创建数据目录时执行
      - ./init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --default-authentication-plugin=mysql_native_password
      --default-time-zone=+08:00
      --max-connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 必须显式挂到共享网络。只在顶层声明 networks 是不够的 ——
    # 那样 Docker 会把容器接到默认的 shared-infra_default，
    # 业务应用的 compose 在 shared-infra-net 上就解析不到 shared-mysql。
    networks:
      - shared-infra-net

  # ============================================================
  # Redis —— 共享实例，靠 key 前缀隔离
  # ============================================================
  redis:
    image: ${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}:redis-7.0
    container_name: shared-redis
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6379:6379"    # 只允许本机访问
    volumes:
      - redis-data:/data
    # shell -c 包装，让 ${REDIS_PASSWORD} 在容器启动时展开
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 同 mysql —— 显式挂到共享网络，业务应用才能用容器名解析
    networks:
      - shared-infra-net

# ============================================================
# 外部网络 —— 业务应用 compose 也接进来
# ============================================================
# external: true 表示这个网络不由本 compose 创建和管理，
# 需要它存在。首次部署时手工建一次：
#   docker network create shared-infra-net
# 或者用 deploy.sh，它会自动建。
networks:
  shared-infra-net:
    external: true
    name: shared-infra-net

volumes:
  mysql-data:
  redis-data:
