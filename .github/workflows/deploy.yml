# 通用 Docker 镜像 build + deploy 流水线
#
# 依赖 GitHub Vars(明文配置)+ Secrets(凭证)+ ECS self-hosted runner
# 配置项见同目录 README.md

name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_name: ${{ env.IMAGE_NAME }}
    env:
      ACR_REGISTRY_HOST: ${{ vars.ACR_REGISTRY_HOST }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      BASE_GOLANG_TAG: ${{ vars.BASE_GOLANG_TAG }}
      BASE_ALPINE_TAG: ${{ vars.BASE_ALPINE_TAG }}
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=${IMAGE_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "▶ Image tag: ${IMAGE_NAME}-${SHORT_SHA}"

      - name: Login to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "▶ ACR login: ${ACR_REGISTRY_HOST}"
          echo "${ACR_PASSWORD}" | docker login \
            --username "${ACR_USERNAME}" \
            --password-stdin "${ACR_REGISTRY_HOST}"
          echo "✅ ACR login OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        # 一次 build 打两个 tag:
        #   ${IMAGE_NAME}-<sha>   immutable,精确版本
        #   ${IMAGE_NAME}-latest  mutable pointer,deploy job 拉这个
        run: |
          set -e
          REGISTRY="${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}"
          GOLANG_IMAGE="${REGISTRY}:${BASE_GOLANG_TAG}"
          ALPINE_IMAGE="${REGISTRY}:${BASE_ALPINE_TAG}"

          IMAGE="${REGISTRY}:${{ steps.meta.outputs.image_tag }}"
          LATEST="${REGISTRY}:${IMAGE_NAME}-latest"

          # 清老 cache metadata,防止遗留 --mount=type=cache 元数据报错
          docker builder prune -af || true

          echo "▶ Building ${IMAGE} + ${LATEST}"
          # 必须显式传 --build-arg:Dockerfile 里的默认值只是兜底
          # shell 默认值:GH Var 没设时回落到 Dockerfile 的默认值
          EFFECTIVE_GOLANG_TAG="${BASE_GOLANG_TAG:-golang-1.25-alpine}"
          EFFECTIVE_ALPINE_TAG="${BASE_ALPINE_TAG:-alpine-3.21}"

          # --provenance=false --sbom=false 必须保留:
          #   BuildKit(v0.32+) 默认会在镜像 index 里附带一个
          #   application/vnd.oci.empty.v1+json 的 attestation manifest。
          #   阿里云 ACR 个人版不认这个 media type,push 直接被拒:
          #     denied: unknown manifest class for application/vnd.oci.empty.v1+json
          #   关掉证明信息后只推普通 image manifest,ACR 才能收。

          docker buildx build \
            --no-cache \
            --pull \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg "REGISTRY=${REGISTRY}" \
            --build-arg "GOLANG_TAG=${EFFECTIVE_GOLANG_TAG}" \
            --build-arg "ALPINE_TAG=${EFFECTIVE_ALPINE_TAG}" \
            -t "${IMAGE}" \
            -t "${LATEST}" \
            --push \
            -f Dockerfile \
            .

          echo "✅ Pushed ${IMAGE} + ${LATEST}"

  deploy:
    name: Deploy to self-hosted runner
    runs-on: [self-hosted, docker, aliyun]
    needs: build
    concurrency:
      group: ${{ vars.CONCURRENCY_GROUP }}
      cancel-in-progress: true
    env:
      ACR_REGISTRY_HOST: ${{ vars.ACR_REGISTRY_HOST }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      APP_CONTAINER: ${{ vars.APP_CONTAINER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      HEALTH_PORT: ${{ vars.HEALTH_PORT }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Pull image from ACR
        # 拉 ${IMAGE_NAME}-latest,re-tag 成 ${IMAGE_NAME}:server-latest
        # 凭证从 ${DEPLOY_DIR}/.env 读 REGISTRY_USERNAME / REGISTRY_PASSWORD
        run: |
          set -e
          if [ -f "${DEPLOY_DIR}/.env" ]; then
            set -a; source ${DEPLOY_DIR}/.env; set +a
          fi
          REGISTRY="${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}"
          echo "▶ ACR login: ${REGISTRY}"
          echo "${REGISTRY_PASSWORD}" | docker login \
            --username "${REGISTRY_USERNAME}" \
            --password-stdin "${REGISTRY}"

          REMOTE_IMAGE="${REGISTRY}:${IMAGE_NAME}-latest"
          LOCAL_IMAGE="${IMAGE_NAME}:server-latest"
          docker pull "${REMOTE_IMAGE}"
          docker tag "${REMOTE_IMAGE}" "${LOCAL_IMAGE}"
          echo "✅ Pulled ${REMOTE_IMAGE} → ${LOCAL_IMAGE}"

      - name: Sync & deploy
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          # 首次部署:创建部署目录
          if [ ! -d "${DEPLOY_DIR}" ]; then
            echo "首次部署,创建 ${DEPLOY_DIR}..."
            mkdir -p "${DEPLOY_DIR}"
          fi
          # local-life-api 的 docker-compose.yml 在 deploy/ 子目录
          cp $GITHUB_WORKSPACE/deploy/docker-compose.yml ${DEPLOY_DIR}/docker-compose.yml

          # 首次部署:从 .env.example 生成 .env
          if [ ! -f "${DEPLOY_DIR}/.env" ]; then
            if [ -f deploy/.env.example ]; then
              cp deploy/.env.example ${DEPLOY_DIR}/.env
              echo "⚠️ 已创建 ${DEPLOY_DIR}/.env(从 deploy/.env.example),请手动填入真实凭证后再部署"
            else
              echo "❌ 项目无 deploy/.env.example,请手动创建 ${DEPLOY_DIR}/.env 后再触发部署"
              exit 1
            fi
          fi

          # 共享底座的网络 —— mysql / redis 在别的 compose project 里,
          # 本 compose 用 external network 连过去。外部网络不会自动创建,
          # 幂等地补一次。
          docker network inspect shared-infra-net >/dev/null 2>&1 || \
            docker network create shared-infra-net

          # ============================================================
          # 共享底座准备
          # ============================================================
          # 新 compose 让应用连 shared-mysql / shared-redis。
          # 底座不存在的话应用起来连不上 mysql,健康检查必挂 ——
          # 所以起应用**之前**必须确认底座在跑。
          #
          # 底座的数据是持久的(独立 volume),这里只做「确认在跑」,
          # 不会动数据。
          INFRA_DIR="${DEPLOY_DIR}/infra"

          if [ ! -f "${INFRA_DIR}/docker-compose.yml" ]; then
            echo "首次部署:同步共享底座文件..."
            mkdir -p "${INFRA_DIR}"
            cp -r $GITHUB_WORKSPACE/deploy/infra/. "${INFRA_DIR}/"
          fi

          # 底座的 .env:跟应用的 .env 用同一套凭证(应用 .env 里已经有
          # MYSQL_ROOT_PASSWORD / REDIS_PASSWORD),避免两处填不一致连不上。
          if [ ! -f "${INFRA_DIR}/.env" ]; then
            echo "▶ 生成 ${INFRA_DIR}/.env(复用应用凭证)..."
            set -a; source "${DEPLOY_DIR}/.env"; set +a
            {
              echo "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}"
              echo "REDIS_PASSWORD=${REDIS_PASSWORD}"
              echo "ACR_REGISTRY_HOST=${ACR_REGISTRY_HOST:-}"
              echo "ACR_NAMESPACE=${ACR_NAMESPACE:-}"
            } > "${INFRA_DIR}/.env"
            chmod 600 "${INFRA_DIR}/.env"
          fi

          cd "${INFRA_DIR}"
          if ! docker ps --format '{{.Names}}' | grep -qx shared-mysql; then
            echo "▶ 启动共享底座..."
            ./deploy.sh up
          else
            echo "✓ 共享底座已在运行"
          fi
          cd "${{ github.workspace }}"

          # ============================================================
          # 清理不属于当前 project 的同名容器
          # ============================================================
          # 同一个 container_name 不能同时属于两个 compose project。
          # 改过 compose 的 name: 字段(或者部署目录改名)之后,旧 project
          # 留下的容器会让 compose 拒绝接管:
          #   Conflict. The container name "/local-life-api" is already in use
          # 所以先把不属于当前 project 的同名容器删掉。
          #
          # project 名从 compose 文件里读(优先 name: 字段,没有就退回
          # 目录名 —— compose 的默认规则)。不用 python 解析 JSON:
          # ECS 上不一定装了 python3。
          CURRENT_PROJECT=$(cd ${DEPLOY_DIR} && docker compose config 2>/dev/null | grep -E "^name:" | head -1 | awk '{print $2}')
          if [ -z "${CURRENT_PROJECT}" ]; then
            CURRENT_PROJECT=$(basename "${DEPLOY_DIR}")
          fi
          echo "▶ 当前 compose project: ${CURRENT_PROJECT}"

          if docker ps -a --filter "name=^/${APP_CONTAINER}$" --format '{{.Names}}' | grep -qx "${APP_CONTAINER}"; then
            EXISTING_PROJECT=$(docker inspect "${APP_CONTAINER}" \
              --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || echo "")
            if [ "${EXISTING_PROJECT}" != "${CURRENT_PROJECT}" ]; then
              echo "  删除旧 project(${EXISTING_PROJECT})留下的容器 ${APP_CONTAINER}"
              docker rm -f "${APP_CONTAINER}"
            else
              echo "  ${APP_CONTAINER} 已属于当前 project,保留(compose 会复用它)"
            fi
          fi

          # 重启 api 容器
          # 不加 --wait:容器没 HEALTHCHECK 会卡 90s timeout
          cd ${DEPLOY_DIR}
          docker compose up -d --no-deps ${APP_CONTAINER}
          docker ps -a

          docker image prune -f
          echo "✅ ${IMAGE_NAME} deployed"

      - name: Health check
        # docker exec 进容器内检测(Linux runner 上 host.docker.internal 不通)
        run: |
          echo "⏳ 等待 ${APP_CONTAINER} 健康检查..."
          for i in $(seq 1 30); do
            if docker exec ${APP_CONTAINER} wget -q -T 2 -O /dev/null http://localhost:${HEALTH_PORT}${HEALTH_PATH} 2>/dev/null; then
              echo "✅ 健康(尝试 $i 次,wget ${HEALTH_PATH})"
              exit 0
            fi
            if docker exec ${APP_CONTAINER} nc -z localhost ${HEALTH_PORT} 2>/dev/null; then
              echo "✅ 端口 ${HEALTH_PORT} 已监听(尝试 $i 次,nc -z)"
              exit 0
            fi
            sleep 2
          done
          echo "⚠️ 30 次未通过健康检查,请手动 docker compose logs ${APP_CONTAINER}"
          exit 1