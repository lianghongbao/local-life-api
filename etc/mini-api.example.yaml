# ============================================================
# 生产环境配置模板
# ============================================================
# 用法:
#   1. cp etc/mini-api.example.yaml etc/mini-api.local.yaml
#   2. 在 etc/mini-api.local.yaml 里填真实值(或由部署平台注入更佳)
#   3. 启动:GO_CONFIG_FILE=etc/mini-api.local.yaml ./local-life-api
#
# 所有 ${...} 占位符由部署平台(K8s Secret / systemd EnvironmentFile 等)注入,
# 真实文件需 .gitignore

Name: mini-api
Host: 0.0.0.0
Port: 8888
EnableGzip: true

DB:
  DataSource: ${DB_DATASOURCE}
  Policy: round-robin

CacheRedis:
  - Host: ${REDIS_HOST}
    Type: node
    Pass: ${REDIS_PASS}
    Weight: 100

Auth:
  AccessSecret: "${AUTH_ACCESS_SECRET}"
  AccessExpire: 7200

AdminAuth:
  AccessSecret: "${ADMIN_AUTH_SECRET}"
  AccessExpire: 7200

RefreshSecret: "${REFRESH_SECRET}"
RefreshExpire: 604800

WxMini:
  AppID: "${WX_APP_ID}"
  AppSecret: "${WX_APP_SECRET}"

OSS:
  Endpoint:        "${OSS_ENDPOINT}"
  Bucket:          "${OSS_BUCKET}"
  Region:          "${OSS_REGION}"
  AccessKeyID:     "${OSS_ACCESS_KEY_ID}"
  AccessKeySecret: "${OSS_ACCESS_KEY_SECRET}"
  RoleArn:         "${OSS_ROLE_ARN}"
  # SignURLExpire:   3600
  # UploadHost: 上传目标(OSS bucket 域名),CDN 不支持上传
  UploadHost:      "${OSS_UPLOAD_HOST:-}"
  # URLPrefix: CDN 加速域名(访问用),入库 URL 和业务返回 URL 均使用此前缀
  URLPrefix:       "${OSS_URL_PREFIX:-}"
  Hosts:
    - "${OSS_ALLOWED_HOST}"

MiniApp:
  MaxImagesPerPost: 9
  DefaultPageSize: 10
  MaxPageSize: 50

Log:
  ServiceName: mini-api
  Mode: file
  Path: /data/logs/mini-api
  Level: info
  Encoding: json
  Compress: true
  MaxSize: 100
  MaxBackups: 10
  KeepDays: 7
  Rotation: daily
  Stat: false

Cors:
  # 生产同源部署时设 false,无需 CORS 白名单
  Enabled: false
  AllowOrigins: []
  AllowMethods: []
  AllowHeaders: []
  ExposeHeaders: []
  AllowCredentials: false
  MaxAge: 86400

# ============================================================
# 腾讯位置服务(reverse geocoding)
# ============================================================
# 申请地址:https://lbs.qq.com/webservice_v1/guide-geocoder
TencentMap:
  Key: TENCENT_MAP_KEY_PLACEHOLDER

# ============================================================
# 评论系统配置
# ============================================================
CommentLimit:
  CreatePerMin: 10
  LikePerMin: 60
  ReportPerHour: 10
ReportThreshold: 3