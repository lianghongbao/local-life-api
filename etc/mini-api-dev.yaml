Name: mini-api
Host: 0.0.0.0
Port: 8888

# 开启Gzip压缩
EnableGzip: true

# ============================================================
# MySQL
# ============================================================
DB:
  DataSource: ${DB_DATASOURCE:-root:123456@tcp(127.0.0.1:3306)/local_life?charset=utf8mb4&parseTime=True&loc=Local}
  Policy: round-robin

# ============================================================
# Redis
# ============================================================
CacheRedis:
  - Host: ${REDIS_HOST:-127.0.0.1:6379}
    Type: node
    Pass: ${REDIS_PASS:-}
    Weight: 100

# ============================================================
# JWT
# ============================================================
Auth:
  AccessSecret: "${AUTH_ACCESS_SECRET:-dev-auth-secret-CHANGE-ME}"
  AccessExpire: 7200

AdminAuth:
  AccessSecret: "${ADMIN_AUTH_SECRET:-dev-admin-secret-CHANGE-ME}"
  AccessExpire: 7200

RefreshSecret: "${REFRESH_SECRET:-dev-refresh-secret-CHANGE-ME}"
RefreshExpire: 604800

# ============================================================
# 微信小程序
# ============================================================
# AppID / AppSecret 在 微信公众平台 申请
WxMini:
  AppID: "${WX_APP_ID}"
  AppSecret: "${WX_APP_SECRET}"

# ============================================================
# 阿里云 OSS(图片直传 + STS 临时凭证)
# ============================================================
# RAM 凭证在 阿里云访问控制 创建
OSS:
  Endpoint:        "${OSS_ENDPOINT}"
  Bucket:          "${OSS_BUCKET}"
  Region:          "${OSS_REGION}"
  AccessKeyID:     "${OSS_ACCESS_KEY_ID}"
  AccessKeySecret: "${OSS_ACCESS_KEY_SECRET}"
  RoleArn:         "${OSS_ROLE_ARN}"
  # SignURLExpire:   3600
  # UploadHost: 上传目标(OSS bucket 域名),CDN 不支持上传
  UploadHost:      "${OSS_UPLOAD_HOST:-}"
  # URLPrefix: 访问前缀(CDN 域名),入库 URL 和业务返回 URL 均使用此前缀
  URLPrefix:       "${OSS_URL_PREFIX:-}"
  Hosts:
    - "${OSS_ALLOWED_HOST}"

# ============================================================
# 业务配置
# ============================================================
MiniApp:
  MaxImagesPerPost: 9
  DefaultPageSize: 10
  MaxPageSize: 50

# ============================================================
# 日志配置
# ============================================================
Log:
  ServiceName: mini-api
  Mode: file
  Path: logs
  Level: info
  Encoding: json
  Compress: true
  MaxSize: 100
  MaxBackups: 10
  KeepDays: 7
  Rotation: daily
  Stat: false

# ============================================================
# CORS 跨域配置
# ============================================================
Cors:
  Enabled: true
  AllowOrigins:
    - "http://localhost:8080"
    - "http://127.0.0.1:5174"             # Vite 默认 dev 端口
  AllowMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  AllowHeaders:
    - Origin
    - Content-Type
    - Authorization
    - X-Requested-With
  ExposeHeaders:
    - Content-Length
  AllowCredentials: true
  MaxAge: 86400

# ============================================================
# 评论系统配置
# ============================================================
CommentLimit:
  CreatePerMin: 10
  LikePerMin: 60
  ReportPerHour: 10
ReportThreshold: 3